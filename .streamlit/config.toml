# Smart Budgeter theme: formal and pastel.
#
# Serif headings (Source Serif 4, as in the logo) over a clean sans body (Inter), a soft
# blue-grey page with near-white cards, and muted pastel accents. Keep these colours in step
# with TOKENS in app.py (our own CSS) and the tokens at the top of charts.py (Plotly charts).
# The app starts in light mode; the "Dark mode" switch in the sidebar flips to [theme.dark].

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&display=swap"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseFontSize = 15
baseRadius = "0.55rem"
buttonRadius = "0.55rem"
showWidgetBorder = true
showSidebarBorder = true
# Same pastel order as charts.SERIES: blue, peach, mint, butter, pink, sage, lavender, coral.
chartCategoricalColors = ["#7fa6e3", "#f2a07b", "#6fc4a1", "#f0c75e", "#eb9cc0", "#9cc47a", "#a99be3", "#e98b8b"]
chartSequentialColors = ["#eef2fb", "#dbe5f8", "#c3d5f3", "#b1c8ef", "#9fbbea", "#8fb0e6", "#7fa6e3", "#6d92da", "#5b7fcf", "#42609f"]

